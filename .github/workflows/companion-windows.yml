name: PopTab Windows Companion

on:
  push:
    branches: [main, feature/native-titlebar-pin]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check extension script and manifest syntax
        shell: pwsh
        run: |
          node --check background.js
          node --check native-companion.js
          Get-Content manifest.json -Raw | ConvertFrom-Json | Out-Null
      - name: Check Native Messaging bridge behavior
        run: node --test companion/tests/bridge.test.cjs
      - name: Configure C++
        run: cmake -S companion -B companion/build -A x64
      - name: Build C++
        run: cmake --build companion/build --config Release
      - name: Native messaging framing smoke test
        run: python companion/tests/smoke.py companion/build/Release/PopTabCompanion.exe
      - name: Test native titlebar button and topmost toggling
        run: python companion/tests/window_pin.py companion/build/Release/PopTabCompanion.exe
      - name: Package portable companion and extension
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path companion/dist | Out-Null
          Copy-Item companion/build/Release/PopTabCompanion.exe companion/dist/
          Copy-Item companion/install.ps1,companion/uninstall.ps1,companion/Setup.cmd,companion/Uninstall.cmd,companion/README.md companion/dist/
          New-Item -ItemType Directory -Force -Path companion/dist/PopTab-extension | Out-Null
          Copy-Item manifest.json,background.js,native-companion.js,video-float.js companion/dist/PopTab-extension/
          Copy-Item assets companion/dist/PopTab-extension/assets -Recurse
      - name: Check automatic discovery, native host registration and uninstall
        shell: powershell
        run: .\companion\tests\setup.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: PopTabCompanion-Win64
          path: companion/dist/
          if-no-files-found: error
