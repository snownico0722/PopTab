name: PopTab Windows Companion
on:
  push:
    branches: [main, feature/native-titlebar-pin]
  pull_request:
concurrency:
  group: companion-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    permissions:
      contents: write # publish the v0.2.1 Release only after main's full CI succeeds
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.poptab-browsers
    steps:
      - uses: actions/checkout@v4
      - name: Check extension and bridge behavior
        shell: pwsh
        run: |
          node --check background.js
          node --check native-companion.js
          node --test companion/tests/bridge.test.cjs
          Get-Content manifest.json -Raw | ConvertFrom-Json | Out-Null
      - name: Build portable native EXE
        run: |
          cmake -S companion -B companion/build -A x64
          cmake --build companion/build --config Release
      - name: Native protocol smoke test
        run: python companion/tests/smoke.py companion/build/Release/PopTabCompanion.exe
      - name: Installer discovery, repair and uninstall
        shell: powershell
        run: .\companion\tests\setup.ps1
      - name: Install test browser (test-only dependency)
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Real Chromium integration
        run: python companion/tests/window_pin.py companion/build/Release/PopTabCompanion.exe
      - uses: actions/upload-artifact@v4
        with:
          name: PopTabCompanion-OneFile-Win64
          path: companion/build/Release/PopTabCompanion.exe
          if-no-files-found: error
      - name: Publish PopTab Companion v0.2.1 on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v0.2.1" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "v0.2.1 Release already exists, skipping publish."
            exit 0
          }
          gh release create "v0.2.1" "companion/build/Release/PopTabCompanion.exe#PopTabCompanion.exe" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "PopTab Companion v0.2.1" --notes-file "companion/RELEASE_NOTES_0.2.1.md"
          if ($LASTEXITCODE -ne 0) { throw "Unable to publish GitHub Release v0.2.1" }
